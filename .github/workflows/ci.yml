name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl, gd, zip
          coverage: none
          tools: composer:v2
      - name: ImageMagick und GraphicsMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick graphicsmagick
      - name: Abhängigkeiten
        run: composer install --no-interaction --no-progress
      - name: PHP-Lint
        run: find Classes Configuration Tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPStan
        run: .Build/bin/phpstan analyse -c Build/phpstan.neon --no-progress --memory-limit=1G
      - name: Functional Tests
        env:
          typo3DatabaseDriver: pdo_sqlite
        run: .Build/bin/phpunit -c Build/phpunit/FunctionalTests.xml
