<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:argument name="cssEinbinden" type="boolean" optional="{true}" />
<f:argument name="lightbox" type="boolean" optional="{true}" default="{true}" />
<f:comment>lightbox: 0 (Übersicht) lädt nur das Grundstyling, ohne PhotoSwipe, Lightbox-CSS und galerie.js.</f:comment>
<f:if condition="{lightbox}">
    <f:asset.css identifier="crgalerie-photoswipe" href="EXT:crgalerie/Resources/Public/Vendor/photoswipe/photoswipe.css" />
    <f:asset.css identifier="crgalerie-lightbox" href="EXT:crgalerie/Resources/Public/Css/lightbox.css" />
</f:if>
<f:if condition="{cssEinbinden}">
    <f:asset.css identifier="crgalerie" href="EXT:crgalerie/Resources/Public/Css/galerie.css" />
</f:if>
<f:if condition="{lightbox}">
    <f:asset.script identifier="crgalerie" src="EXT:crgalerie/Resources/Public/JavaScript/galerie.js" type="module" />
</f:if>
</html>
